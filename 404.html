<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — travelnow.info</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://travelnow.info/">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<style>
  :root { --bg:#05070d; --panel:#111827; --fg:#e7ecf5; --fg-mute:#6b7591; --border:rgba(148,173,220,0.15); --link:#60a5fa; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; line-height:1.5; padding:20px; }
  .card { max-width:520px; text-align:center; }
  .glyph { font-size:48px; margin-bottom:16px; opacity:0.7; }
  h1 { font-size:24px; margin:0 0 8px; letter-spacing:-0.01em; }
  p { font-size:14px; color:var(--fg-mute); margin:0 0 20px; }
  .actions { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-bottom:18px; }
  a { display:inline-block; padding:10px 18px; border-radius:8px; background:var(--panel); border:1px solid var(--border); color:var(--fg); text-decoration:none; font-size:13px; }
  a:hover { border-color:var(--fg-mute); }
  a.primary { background:var(--link); color:#05070d; border-color:transparent; font-weight:500; }
  .suggestions {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px; margin-top: 18px; display: none;
  }
  .suggestions.has { display: block; }
  .suggestions .label { font-size: 11px; color: var(--fg-mute); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; font-family: ui-monospace, monospace; }
  .suggestions .item { display: inline-block; margin: 4px; padding: 6px 12px; background: #1a2236; border-radius: 6px; font-size: 13px; }
  .suggestions .item a { display: inline; padding: 0; background: transparent; border: none; color: var(--fg); }
</style>
  <script src="/assets/analytics.js"></script>
</head>
<body>
<main class="card">
  <div class="glyph">🌍</div>
  <h1>This destination doesn't exist</h1>
  <p>The page you tried to reach isn't on travelnow.info. Maybe a typo, or the link is stale.</p>
  <div class="actions">
    <a class="primary" href="/">Open the interactive globe</a>
    <a href="/passport/">Browse all passports</a>
  </div>
  <div id="suggestions" class="suggestions">
    <div class="label">Did you mean?</div>
    <div id="suggestions-list"></div>
  </div>
</main>

<script>
(function () {
  // If the URL looks like /passport/<something>/, try to match <something>
  // against the passport list and surface the top 3 candidates.
  var m = location.pathname.match(/\/passport\/([^\/]+)/i);
  if (!m) return;
  var query = decodeURIComponent(m[1]).toLowerCase().replace(/-/g, " ");

  // Compact iso → name table (kept small — only the names users actually mistype).
  var P = [
    ["us","United States"],["gb","United Kingdom"],["de","Germany"],["fr","France"],
    ["it","Italy"],["es","Spain"],["nl","Netherlands"],["be","Belgium"],["se","Sweden"],
    ["no","Norway"],["dk","Denmark"],["fi","Finland"],["pl","Poland"],["cz","Czech Republic"],
    ["at","Austria"],["ch","Switzerland"],["ie","Ireland"],["pt","Portugal"],["gr","Greece"],
    ["ro","Romania"],["bg","Bulgaria"],["hu","Hungary"],["sk","Slovakia"],["si","Slovenia"],
    ["hr","Croatia"],["rs","Serbia"],["ba","Bosnia and Herzegovina"],["mk","North Macedonia"],
    ["al","Albania"],["me","Montenegro"],["xk","Kosovo"],["xn","Northern Cyprus"],
    ["tr","Turkey"],["ru","Russia"],["ua","Ukraine"],["by","Belarus"],["md","Moldova"],
    ["jp","Japan"],["kr","South Korea"],["cn","China"],["tw","Taiwan"],["hk","Hong Kong"],
    ["sg","Singapore"],["my","Malaysia"],["th","Thailand"],["vn","Vietnam"],["id","Indonesia"],
    ["ph","Philippines"],["in","India"],["pk","Pakistan"],["bd","Bangladesh"],["lk","Sri Lanka"],
    ["np","Nepal"],["mm","Myanmar"],["kh","Cambodia"],["la","Laos"],
    ["sa","Saudi Arabia"],["ae","United Arab Emirates"],["qa","Qatar"],["kw","Kuwait"],
    ["bh","Bahrain"],["om","Oman"],["jo","Jordan"],["lb","Lebanon"],["ps","Palestine"],
    ["il","Israel"],["ir","Iran"],["iq","Iraq"],["sy","Syria"],["ye","Yemen"],
    ["eg","Egypt"],["ma","Morocco"],["tn","Tunisia"],["dz","Algeria"],["ly","Libya"],
    ["sd","Sudan"],["et","Ethiopia"],["ke","Kenya"],["tz","Tanzania"],["ng","Nigeria"],
    ["gh","Ghana"],["za","South Africa"],
    ["us","United States"],["ca","Canada"],["mx","Mexico"],["br","Brazil"],["ar","Argentina"],
    ["cl","Chile"],["co","Colombia"],["pe","Peru"],["ve","Venezuela"],["uy","Uruguay"],
    ["au","Australia"],["nz","New Zealand"],
  ];

  // Levenshtein distance (small; ok for ~100 items at page-load time)
  function lev(a, b) {
    if (a === b) return 0;
    var m = a.length, n = b.length;
    if (!m) return n; if (!n) return m;
    var prev = new Array(n + 1), curr = new Array(n + 1);
    for (var j = 0; j <= n; j++) prev[j] = j;
    for (var i = 1; i <= m; i++) {
      curr[0] = i;
      for (var j = 1; j <= n; j++) {
        var cost = a.charCodeAt(i - 1) === b.charCodeAt(j - 1) ? 0 : 1;
        curr[j] = Math.min(curr[j - 1] + 1, prev[j] + 1, prev[j - 1] + cost);
      }
      var t = prev; prev = curr; curr = t;
    }
    return prev[n];
  }

  // Score candidates: prefer prefix matches + low edit distance.
  var scored = P.map(function (row) {
    var iso = row[0], name = row[1].toLowerCase();
    var d = Math.min(lev(query, iso), lev(query, name));
    if (name.indexOf(query) === 0 || iso === query.slice(0, 2)) d -= 4;
    return { iso: row[0], name: row[1], d: d };
  }).sort(function (a, b) { return a.d - b.d; }).slice(0, 3);

  if (scored.length === 0 || scored[0].d > Math.max(query.length, 4)) return;

  var list = document.getElementById("suggestions-list");
  scored.forEach(function (s) {
    var span = document.createElement("span");
    span.className = "item";
    span.innerHTML = '<a href="/passport/' + s.iso + '/">' + s.name + '</a>';
    list.appendChild(span);
  });
  document.getElementById("suggestions").classList.add("has");
})();
</script>
</body>
</html>
