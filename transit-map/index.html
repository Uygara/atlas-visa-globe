<style>
  :root {
    --bg-0: #05070d;
    --bg-1: #0a0f1c;
    --bg-2: #111827;
    --bg-3: #1a2236;
    --panel: rgba(15, 22, 38, 0.72);
    --panel-border: rgba(148, 173, 220, 0.10);
    --panel-border-strong: rgba(148, 173, 220, 0.18);
    --fg: #e7ecf5;
    --fg-dim: #aab4c8;
    --fg-mute: #6b7591;
    --fg-faint: #4a5269;
    --vf: #4ade80;
    --vf-glow: #22c55e;
    --ev: #a3e635;
    --voa: #facc15;
    --vr: #ef4444;
    --vr-glow: #b91c1c;
    --na: #2a3245;
    --self: #60a5fa;
    --compare-self: #f59e0b;
    --land: #1c2638;
    --land-stroke: #2a3650;
    --ocean: transparent;
    --graticule: rgba(120, 140, 180, 0.07);
    --font-sans: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg-0); color: var(--fg);
    font-family: var(--font-sans); font-feature-settings: "ss01", "cv11";
    -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  body {
    background:
      radial-gradient(ellipse 80% 60% at 70% 40%, rgba(40, 80, 150, 0.18), transparent 70%),
      radial-gradient(ellipse 60% 80% at 20% 90%, rgba(80, 30, 130, 0.10), transparent 70%),
      var(--bg-0);
  }
  body::before {
    content: ""; position: fixed; inset: 0;
    background-image:
      radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 80% 70%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 50% 50%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1px 1px at 10% 80%, rgba(255,255,255,0.35), transparent),
      radial-gradient(1px 1px at 90% 20%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 35% 65%, rgba(255,255,255,0.25), transparent),
      radial-gradient(1px 1px at 65% 35%, rgba(255,255,255,0.3), transparent);
    background-size: 250px 250px, 300px 300px, 200px 200px, 350px 350px, 280px 280px, 220px 220px, 320px 320px;
    pointer-events: none; opacity: 0.5; z-index: 0;
  }
  #root { position: relative; height: 100vh; width: 100vw; z-index: 1; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(148, 173, 220, 0.12); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(148, 173, 220, 0.22); }
  .country { transition: fill 220ms ease, opacity 220ms ease; cursor: pointer; }
  .country:hover { filter: brightness(1.25); }
  .country.dim { opacity: 0.18; }
  .loading-screen {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: var(--bg-0); z-index: 100; transition: opacity 400ms ease;
  }
  .loading-screen.hidden { opacity: 0; pointer-events: none; visibility: hidden; }
  .loading-pulse {
    width: 80px; height: 80px; border-radius: 50%;
    background: radial-gradient(circle, rgba(96, 165, 250, 0.6), transparent 70%);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(0.8); opacity: 0.4; }
    50% { transform: scale(1.1); opacity: 1; }
  }
  body.theme-light {
    background:
      radial-gradient(ellipse 80% 60% at 70% 40%, rgba(96, 165, 250, 0.10), transparent 70%),
      #f5f7fb;
  }
  body.theme-light::before { opacity: 0; }
  body.theme-light {
    --bg-0: #f5f7fb;
    --bg-1: #eef2f8;
    --bg-2: #e6ecf4;
    --bg-3: #dde4ee;
    --panel: rgba(255, 255, 255, 0.92);
    --panel-border: rgba(30, 40, 60, 0.10);
    --panel-border-strong: rgba(30, 40, 60, 0.18);
    --fg: #0f1722;
    --fg-dim: #3d4a5e;
    --fg-mute: #6b7791;
    --fg-faint: #9aa3b5;
    --land: #dde6f1;
    --land-stroke: #6b7e9a;
    --graticule: rgba(60, 90, 130, 0.10);
    --na: #c8d0dc;
    --sphere-1: #e8f3fc;
    --sphere-2: #cfe3f5;
    --sphere-3: #aed1ea;
    --atm-mid: rgba(96, 165, 250, 0.22);
  }
  :root {
    --sphere-1: #1a2540;
    --sphere-2: #0d1426;
    --sphere-3: #06091a;
    --atm-mid: rgba(96, 165, 250, 0.18);
  }
  #sphere stop:nth-child(1) { stop-color: var(--sphere-1); }
  #sphere stop:nth-child(2) { stop-color: var(--sphere-2); }
  #sphere stop:nth-child(3) { stop-color: var(--sphere-3); }
  #atm stop:nth-child(2) { stop-color: var(--atm-mid); }
</style>
