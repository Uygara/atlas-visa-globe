<style>

  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg-0); color: var(--fg); font-family: var(--font-sans); font-feature-settings: "ss01", "cv11"; -webkit-font-smoothing: antialiased; overflow: hidden; }
  body { background: radial-gradient(ellipse 80% 60% at 70% 40%, rgba(40, 80, 150, 0.18), transparent 70%), radial-gradient(ellipse 60% 80% at 20% 90%, rgba(80, 30, 130, 0.10), transparent 70%), var(--bg-0); }
  body::before { content: ""; position: fixed; inset: 0; background-image: radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.5), transparent), radial-gradient(1px 1px at 80% 70%, rgba(255,255,255,0.4), transparent), radial-gradient(1px 1px at 50% 50%, rgba(255,255,255,0.3), transparent), radial-gradient(1px 1px at 10% 80%, rgba(255,255,255,0.35), transparent), radial-gradient(1px 1px at 90% 20%, rgba(255,255,255,0.4), transparent); background-size: 250px 250px, 300px 300px, 200px 200px, 350px 350px, 280px 280px; pointer-events: none; opacity: 0.5; z-index: 0; }
  #root { position: relative; height: 100vh; width: 100vw; z-index: 1; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(148, 173, 220, 0.12); border-radius: 4px; }
  .country { transition: fill 220ms ease, opacity 220ms ease; cursor: pointer; }
  .country:hover { filter: brightness(1.25); }
  .loading-screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--bg-0); z-index: 100; transition: opacity 400ms ease; }
  .loading-screen.hidden { opacity: 0; pointer-events: none; visibility: hidden; }
  .loading-pulse { width: 80px; height: 80px; border-radius: 50%; background: radial-gradient(circle, rgba(96, 165, 250, 0.6), transparent 70%); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { transform: scale(0.8); opacity: 0.4; } 50% { transform: scale(1.1); opacity: 1; } }
  body.theme-light { background: radial-gradient(ellipse 80% 60% at 70% 40%, rgba(96, 165, 250, 0.10), transparent 70%), #f5f7fb; }
  body.theme-light::before { opacity: 0; }
  body.theme-light { --bg-0: #f5f7fb; --bg-1: #eef2f8; --bg-2: #e6ecf4; --bg-3: #dde4ee; --panel: rgba(255, 255, 255, 0.92); --panel-border: rgba(30, 40, 60, 0.10); --panel-border-strong: rgba(30, 40, 60, 0.18); --fg: #0f1722; --fg-dim: #3d4a5e; --fg-mute: #6b7791; --fg-faint: #9aa3b5; --land: #dde6f1; --land-stroke: #6b7e9a; --graticule: rgba(60, 90, 130, 0.10); --na: #c8d0dc; --sphere-1: #e8f3fc; --sphere-2: #cfe3f5; --sphere-3: #aed1ea; --atm-mid: rgba(96, 165, 250, 0.22); }
  #sphere stop:nth-child(1) { stop-color: var(--sphere-1); }
  #sphere stop:nth-child(2) { stop-color: var(--sphere-2); }
  #sphere stop:nth-child(3) { stop-color: var(--sphere-3); }
  #atm stop:nth-child(2) { stop-color: var(--atm-mid); }
  /* Print / save-PDF: drop the globe + chrome, lay the plan out full-width
     on white so it's a clean shareable sheet. */
  @media print {
    html, body { overflow: visible !important; height: auto !important; background: #fff !important; color: #000 !important; }
    body::before { display: none !important; }
    .topbar, .globe-stage, .sheet-handle, .ad-slot { display: none !important; }
    .layout { display: block !important; height: auto !important; }
    .panel { position: static !important; height: auto !important; max-height: none !important; width: 100% !important; box-shadow: none !important; border: none !important; background: #fff !important; overflow: visible !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
    .panel * { color: #000 !important; }
    a { color: #000 !important; text-decoration: underline; }
  }
