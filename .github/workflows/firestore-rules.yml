name: Firestore rules

# Tests firestore.rules against the emulator, then publishes them to the live project.
# Runs when the rules or their test change on main, or by hand. Publishing needs the
# FIREBASE_SERVICE_ACCOUNT secret; without it only the test runs.

on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - tools/test-firestore-rules.js
      - .github/workflows/firestore-rules.yml
  pull_request:
    paths:
      - firestore.rules
      - tools/test-firestore-rules.js
  workflow_dispatch: {}

concurrency:
  group: firestore-rules
  cancel-in-progress: false

jobs:
  rules:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install the emulator tools (not saved to package.json)
        run: |
          mkdir -p "$RUNNER_TEMP/fb" && cd "$RUNNER_TEMP/fb"
          npm init -y >/dev/null
          npm i --no-audit --no-fund firebase-tools@13 @firebase/rules-unit-testing@3 firebase@10
      - name: Test the rules
        env:
          NODE_PATH: ${{ runner.temp }}/fb/node_modules
        run: |
          "$RUNNER_TEMP/fb/node_modules/.bin/firebase" emulators:exec --only firestore --project demo-travelnow \
            "node tools/test-firestore-rules.js"
      - name: Publish the rules
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.FIREBASE_SERVICE_ACCOUNT != ''
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          "$RUNNER_TEMP/fb/node_modules/.bin/firebase" deploy --only firestore:rules --project travelnow-a0cf3 --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
