name: Daily visa refresh

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC every day
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Job-level so the push step's `if` can see whether the secret exists.
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install scraper deps
        working-directory: backend
        run: npm ci

      - name: Scrape Wikipedia
        working-directory: backend
        run: node scraper.js --all

      - name: Fetch news feed (Wikipedia history + UK FCO)
        # Soft-fails: a flaky network on one source shouldn't fail the cron.
        working-directory: backend
        continue-on-error: true
        run: node fetch-news.js

      - name: Refresh transit-visa lists (Wikipedia)
        # Self-updates Schengen ATV + UK DATV nationality lists. Safe-fallback
        # keeps previous lists if the scrape comes back short, so never breaks.
        working-directory: backend
        continue-on-error: true
        run: node fetch-transit.js

      - name: Refresh travel-safety advisories (US State Dept + Canada)
        # Keeps the previous data for a source that fails or parses short.
        working-directory: backend
        continue-on-error: true
        run: node fetch-advisories.js

      - name: Refresh diplomatic / official-passport maps (Wikipedia, ~400 pages)
        # Reads the "Non-ordinary passports" sections of every visa-policy and
        # visa-requirements page. Only what a page names explicitly is emitted, so
        # a changed layout just drops that page (never bad data); if too many
        # fetches fail it exits and the previous file is kept.
        working-directory: backend
        continue-on-error: true
        run: node fetch-variants.js

      - name: Refresh British nationality-class maps (BOTC / BOC)
        # Full sourced visa maps for the British Overseas Territories citizen and
        # British Overseas citizen passport classes. Soft-fails and keeps the
        # previous file if a page returns <50 rows (refuses thin parses).
        working-directory: backend
        continue-on-error: true
        run: node fetch-british-classes.js

      - name: Regenerate SEO pages
        run: node scripts/generate-seo.js
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      - name: Dispatch alert emails (if subscribers exist)
        # Soft-fails if Cloudflare/Resend secrets aren't configured yet —
        # the script just logs "skipping" and exits 0.
        run: node backend/dispatch-alerts.js
        env:
          CLOUDFLARE_API_TOKEN:       ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID:      ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
          RESEND_API_KEY:             ${{ secrets.RESEND_API_KEY }}
          JWT_SECRET:                 ${{ secrets.JWT_SECRET }}
          SITE_URL:                   ${{ vars.SITE_URL }}
          FROM_EMAIL:                 ${{ vars.FROM_EMAIL }}

      - name: Dispatch itinerary apply-by reminders (Pro tier)
        # Same soft-fail behaviour. Sends apply-in-N-days emails for any
        # itinerary stored via POST /api/reminders on Pro subscribers.
        run: node backend/dispatch-reminders.js
        env:
          CLOUDFLARE_API_TOKEN:       ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID:      ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
          RESEND_API_KEY:             ${{ secrets.RESEND_API_KEY }}
          JWT_SECRET:                 ${{ secrets.JWT_SECRET }}
          SITE_URL:                   ${{ vars.SITE_URL }}
          FROM_EMAIL:                 ${{ vars.FROM_EMAIL }}

      - name: Send app push notifications (visa-rule and safety-level changes)
        # Runs only once the FIREBASE_SERVICE_ACCOUNT secret exists (MOBILE-SETUP.md).
        # Compares today's data with the committed copy of yesterday's, so it must run
        # before the commit step below. Soft-fails: a push problem never blocks the data.
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        continue-on-error: true
        working-directory: backend
        run: |
          npm install --no-save firebase-admin@13
          node dispatch-push.js

      - name: Commit + push if changed
        run: |
          git config user.name "atlas-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/passports.js data/passports-snapshot.json data/changelog.js data/visa-news.js data/transit-visa-data.js data/passport-variants-data.js data/passport-variants-gb.js data/travel-advisories.js passport/ sitemap.xml robots.txt
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "data: daily refresh $(date -u +%Y-%m-%d)"
            git push
          fi
