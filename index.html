<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<!-- user-scalable=no on the SPA only: pinch should zoom the globe, not the page.
     Static landing pages keep the default viewport so users can pinch-zoom text. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<title>Atlas — Where can your passport take you?</title>
<meta name="description" content="Interactive visa-requirements globe for 200+ passports. Updated daily from Wikipedia. See where your passport gets you visa-free, eVisa, on arrival, or visa-required." />
<link rel="canonical" href="https://travelnow.info/" />
<!-- SVG favicon is authoritative — modern browsers all support it. The old
     PNG fallback rendered dark in some browsers because it predates the
     white-globe redesign; intentionally dropped. -->
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
<link rel="apple-touch-icon" href="/assets/favicon.svg" />
<meta property="og:title" content="Atlas — Where can your passport take you?" />
<meta property="og:description" content="See visa requirements for 200+ passports on an interactive globe. Free, daily-refreshed from Wikipedia." />
<meta property="og:image" content="https://travelnow.info/assets/og.png" />
<meta property="og:url" content="https://travelnow.info/" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Atlas" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Atlas — Where can your passport take you?" />
<meta name="twitter:description" content="Interactive visa-requirements globe for 200+ passports. Daily refresh from Wikipedia." />
<meta name="twitter:image" content="https://travelnow.info/assets/og.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" />
<style>
  :root {
    /* Backgrounds */
    --bg-0: #05070d;
    --bg-1: #0a0f1c;
    --bg-2: #111827;
    --bg-3: #1a2236;
    --panel: rgba(15, 22, 38, 0.72);
    --panel-border: rgba(148, 173, 220, 0.10);
    --panel-border-strong: rgba(148, 173, 220, 0.18);

    /* Type */
    --fg: #e7ecf5;
    --fg-dim: #aab4c8;
    --fg-mute: #6b7591;
    --fg-faint: #4a5269;

    /* Status palette — traffic light, calibrated for dark */
    --vf: #4ade80;        /* visa-free, vivid green */
    --vf-glow: #22c55e;
    --ev: #a3e635;        /* eVisa, lime */
    --voa: #facc15;       /* visa on arrival, amber */
    --vr: #ef4444;        /* visa required, red */
    --vr-glow: #b91c1c;
    --na: #2a3245;        /* no data */
    --self: #60a5fa;      /* the passport country itself */
    --compare-self: #f59e0b;  /* the compare passport's home country */

    /* Globe land neutral */
    --land: #1c2638;
    --land-stroke: #2a3650;
    --ocean: transparent;
    --graticule: rgba(120, 140, 180, 0.07);

    --font-sans: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg-0);
    color: var(--fg);
    font-family: var(--font-sans);
    font-feature-settings: "ss01", "cv11";
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  body {
    background:
      radial-gradient(ellipse 80% 60% at 70% 40%, rgba(40, 80, 150, 0.18), transparent 70%),
      radial-gradient(ellipse 60% 80% at 20% 90%, rgba(80, 30, 130, 0.10), transparent 70%),
      var(--bg-0);
  }

  /* Subtle starfield */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 80% 70%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 50% 50%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1px 1px at 10% 80%, rgba(255,255,255,0.35), transparent),
      radial-gradient(1px 1px at 90% 20%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 35% 65%, rgba(255,255,255,0.25), transparent),
      radial-gradient(1px 1px at 65% 35%, rgba(255,255,255,0.3), transparent);
    background-size: 250px 250px, 300px 300px, 200px 200px, 350px 350px, 280px 280px, 220px 220px, 320px 320px;
    pointer-events: none;
    opacity: 0.5;
    z-index: 0;
  }

  #root { position: relative; height: 100vh; width: 100vw; z-index: 1; }

  /* Scrollbar (subtle) */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(148, 173, 220, 0.12); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(148, 173, 220, 0.22); }

  /* Globe-specific */
  .country { transition: fill 220ms ease, opacity 220ms ease; cursor: pointer; }
  .country:hover { filter: brightness(1.25); }
  .country.dim { opacity: 0.18; }

  /* Loading */
  .loading-screen {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: var(--bg-0); z-index: 100; transition: opacity 400ms ease;
  }
  .loading-screen.hidden { opacity: 0; pointer-events: none; visibility: hidden; }
  .loading-pulse {
    width: 80px; height: 80px; border-radius: 50%;
    background: radial-gradient(circle, rgba(96, 165, 250, 0.6), transparent 70%);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(0.8); opacity: 0.4; }
    50% { transform: scale(1.1); opacity: 1; }
  }

  /* Light theme override — cleaner, less yellow than the old paper tone */
  body.theme-light {
    background:
      radial-gradient(ellipse 80% 60% at 70% 40%, rgba(96, 165, 250, 0.10), transparent 70%),
      #f5f7fb;
  }
  body.theme-light::before { opacity: 0; }
  body.theme-light {
    --bg-0: #f5f7fb;
    --bg-1: #eef2f8;
    --bg-2: #e6ecf4;
    --bg-3: #dde4ee;
    --panel: rgba(255, 255, 255, 0.92);
    --panel-border: rgba(30, 40, 60, 0.10);
    --panel-border-strong: rgba(30, 40, 60, 0.18);
    --fg: #0f1722;
    --fg-dim: #3d4a5e;
    --fg-mute: #6b7791;
    --fg-faint: #9aa3b5;
    /* Lighter, brighter land/sea so the globe doesn't look murky in light mode.
       Stroke colour kept high-contrast (slate-blue) so country borders read
       even on the pale palette — earlier --b8c3d2 was nearly invisible. */
    --land: #dde6f1;
    --land-stroke: #6b7e9a;
    --graticule: rgba(60, 90, 130, 0.10);
    --na: #c8d0dc;
    /* Ocean blue — softer, brighter tones so the globe reads as 'water'
       instead of a heavy slate disc on the page. */
    --sphere-1: #e8f3fc;
    --sphere-2: #cfe3f5;
    --sphere-3: #aed1ea;
    --atm-mid: rgba(96, 165, 250, 0.22);
  }
  /* Dark theme defaults for the sphere stops, so the SVG references them
     too — keeps light/dark switching as a one-class flip. */
  :root {
    --sphere-1: #1a2540;
    --sphere-2: #0d1426;
    --sphere-3: #06091a;
    --atm-mid: rgba(96, 165, 250, 0.18);
  }
  /* CSS-driven gradient stop colors so the SVG sphere flips with the theme */
  #sphere stop:nth-child(1) { stop-color: var(--sphere-1); }
  #sphere stop:nth-child(2) { stop-color: var(--sphere-2); }
  #sphere stop:nth-child(3) { stop-color: var(--sphere-3); }
  #atm stop:nth-child(2) { stop-color: var(--atm-mid); }
</style>

<!-- Google AdSense (verification + runtime loader). Must be static <script> in
     <head> so AdSense's HTML-only verification crawler can find it. If you ever
     swap accounts, update this client ID in three places: here, /ads.txt,
     and data/ads.js. -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2617798720306957"
        crossorigin="anonymous"></script>

<!-- D3 + TopoJSON for the globe -->
<script src="https://unpkg.com/d3@7.8.5/dist/d3.min.js"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js"></script>

<!-- React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div class="loading-screen" id="loading"><div class="loading-pulse"></div></div>
  <div id="root"></div>

  <!-- Data + components -->
  <script src="data/i18n.js"></script>
  <script src="data/countries.js"></script>
  <script src="data/country-names.js"></script>
  <script src="data/passports.js"></script>
  <script src="data/changelog.js"></script>
  <script src="data/visa-fees.js"></script>
  <script src="data/visa-conditions.js"></script>
  <script src="data/passport-variants.js"></script>
  <script src="data/transit-visa-rules.js"></script>
  <script src="data/etias-rules.js"></script>
  <script src="data/affiliates.js"></script>
  <script src="data/ads.js"></script>
  <!-- AdSense itself is loaded statically in <head> (see above). This block
       only handles Ezoic, which has no verification crawler issue. -->
  <script>
    (function () {
      if (window.EZOIC && window.EZOIC.siteId) {
        var s = document.createElement("script");
        s.async = true;
        s.src = "//www.ezojs.com/ezoic/sa.min.js";
        s.dataset.ezsai = window.EZOIC.siteId;
        document.head.appendChild(s);
      }
    })();
  </script>
  <script type="text/babel" src="components/globe.jsx"></script>
  <script type="text/babel" src="components/panel.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
